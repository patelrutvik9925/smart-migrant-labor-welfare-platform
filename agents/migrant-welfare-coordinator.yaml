description: >
  Main Coordinator for the Smart Migrant Labor Welfare & Skill Mapping Platform.
  Understands worker requests in English, Hindi, or Gujarati and routes them to the
  correct specialized agent. Returns one clear consolidated response to the worker.
  Workers interact only with this coordinator.
