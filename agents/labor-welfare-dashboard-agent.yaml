kind: native
name: labor_welfare_dashboard_agent
display_name: Labor Welfare Dashboard Agent
description: >
  Provides personalized dashboards for Workers, Admins, and Government/Labor Officers.
  Worker dashboard is simple and personal. Admin dashboard is detailed and operational.
  Officer dashboard covers area-level monitoring with personal worker data hidden by default.
spec_version: v1
llm: watsonx-orchestrate/frontier
style: react_core
hide_reasoning: false
memory_enabled: false
context_access_enabled: true
context_variables: []
collaborators: []
tools: []
toolkits: []
skills: []
knowledge_base: []
guidelines: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
bundled: false
is_schedulable: false
chat_with_docs:
  enabled: false
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
